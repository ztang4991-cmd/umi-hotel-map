<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMI 酒店地图 V1 · 婚礼管家工作台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; overflow: hidden; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 320px; background: #1f3864; color: white; overflow-y: auto; padding: 20px 18px; box-shadow: 2px 0 10px rgba(0,0,0,.15); flex-shrink: 0; }
  .sidebar h1 { font-size: 18px; margin-bottom: 4px; }
  .sidebar .subtitle { font-size: 11px; color: #b8c5d6; margin-bottom: 18px; }
  .filter-group { margin-bottom: 18px; }
  .filter-group h3 { font-size: 12px; margin-bottom: 8px; color: #ffc107; letter-spacing: 1px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; transition: all .15s; user-select: none; }
  .chip:hover { background: rgba(255,255,255,0.15); }
  .chip.active { background: #ffc107; color: #1f3864; border-color: #ffc107; font-weight: bold; }
  .stats { background: rgba(255,255,255,.06); padding: 12px 14px; border-radius: 8px; margin-top: 20px; font-size: 12px; line-height: 1.7; }
  .stats .big { font-size: 24px; font-weight: bold; color: #4caf50; }
  .reset-btn { background: #c62828; color: white; border: none; padding: 8px 12px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 12px; font-size: 12px; }
  .reset-btn:hover { background: #b71c1c; }
  .legend { background: rgba(255,255,255,.06); padding: 10px 12px; border-radius: 8px; margin-top: 14px; font-size: 11px; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  #map { flex: 1; height: 100vh; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .popup-card { font-size: 13px; min-width: 220px; }
  .popup-card .name { font-weight: bold; font-size: 14px; color: #1f3864; margin-bottom: 8px; }
  .popup-card .row { margin-bottom: 4px; color: #555; }
  .popup-card .label { color: #999; display: inline-block; width: 60px; }
  .popup-card .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; color: white; font-weight: bold; }
  .badge-shi { background: #1976d2; }
  .badge-chang { background: #7b1fa2; }
  .badge-both { background: #d32f2f; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h1>🏨 UMI 酒店地图</h1>
    <div class="subtitle">婚礼管家工作台 · V1</div>

    <div class="filter-group">
      <h3>📍 区域</h3>
      <div class="chip-row" id="filter-district"></div>
    </div>

    <div class="filter-group">
      <h3>💰 餐标</h3>
      <div class="chip-row" id="filter-budget">
        <div class="chip" data-val="<1500">&lt;1500</div>
        <div class="chip" data-val="1500-3000">1500-3000</div>
        <div class="chip" data-val="3000-5000">3000-5000</div>
        <div class="chip" data-val="5000+">5000+</div>
        <div class="chip" data-val="待询">待询</div>
      </div>
    </div>

    <div class="filter-group">
      <h3>🍽️ 桌数</h3>
      <div class="chip-row" id="filter-capacity">
        <div class="chip" data-val="≤20桌">≤20桌</div>
        <div class="chip" data-val="20-50桌">20-50桌</div>
        <div class="chip" data-val="50-100桌">50-100桌</div>
        <div class="chip" data-val="100桌+">100桌+</div>
        <div class="chip" data-val="待询">待询</div>
      </div>
    </div>

    <div class="filter-group">
      <h3>🎨 风格</h3>
      <div class="chip-row" id="filter-style">
        <div class="chip" data-val="酒店宴会厅">酒店宴会厅</div>
        <div class="chip" data-val="中式">中式</div>
        <div class="chip" data-val="西式">西式</div>
        <div class="chip" data-val="户外草坪">户外草坪</div>
        <div class="chip" data-val="独栋会所">独栋会所</div>
        <div class="chip" data-val="园林度假">园林度假</div>
      </div>
    </div>

    <button class="reset-btn" onclick="resetFilters()">🔄 清空所有筛选</button>

    <div class="stats">
      共 <span class="big" id="count">0</span> 家匹配<br>
      <span style="color:#b8c5d6;">总库: 80 家酒店</span>
    </div>

    <div class="legend">
      <div style="color:#ffc107; margin-bottom: 6px;">渠道图例</div>
      <div class="legend-row"><div class="legend-dot" style="background:#1976d2;"></div>时光在线</div>
      <div class="legend-row"><div class="legend-dot" style="background:#7b1fa2;"></div>昌森</div>
      <div class="legend-row"><div class="legend-dot" style="background:#d32f2f;"></div>两者（双渠道）</div>
    </div>
  </div>
  <div id="map"></div>
</div>

// Build district filter chips dynamically
const districts = [...new Set(HOTELS.map(h => h.district))].sort();
const distContainer = document.getElementById('filter-district');
districts.forEach(d => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.val = d;
  chip.textContent = d;
  distContainer.appendChild(chip);
});

// Filter state
const filters = { district: new Set(), budget: new Set(), capacity: new Set(), style: new Set() };

// Click handler for chips
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const filterId = chip.parentElement.id.replace('filter-','');
    const val = chip.dataset.val;
    if (filters[filterId].has(val)) { filters[filterId].delete(val); chip.classList.remove('active'); }
    else { filters[filterId].add(val); chip.classList.add('active'); }
    applyFilters();
  });
});

function resetFilters() {
  Object.values(filters).forEach(s => s.clear());
  document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
  applyFilters();
}

// Initialize map - centered on Chengdu
// Use 高德 tile server (no key, displays GCJ-02 coords correctly)
const map = L.map('map').setView([30.65, 104.07], 11);
L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'],
  attribution: '高德地图 · GCJ-02',
  maxZoom: 18,
}).addTo(map);

// Marker color by channel
function colorByChannel(c) {
  if (c === '两者') return '#d32f2f';
  if (c === '昌森') return '#7b1fa2';
  return '#1976d2';
}

// Build all markers
const markers = [];
HOTELS.forEach(h => {
  const color = colorByChannel(h.channel);
  const icon = L.divIcon({
    className: 'custom-marker',
    html: `<div style="background:${color};width:16px;height:16px;border:2px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,.4);"></div>`,
    iconSize: [20,20], iconAnchor: [10,10],
  });
  const m = L.marker([h.lat, h.lng], {icon});
  const channelBadge = h.channel === '两者' ? 'badge-both' : (h.channel === '昌森' ? 'badge-chang' : 'badge-shi');
  m.bindPopup(`
    <div class="popup-card">
      <div class="name">${h.name}</div>
      <div class="row"><span class="label">渠道</span><span class="badge ${channelBadge}">${h.channel}</span></div>
      <div class="row"><span class="label">区域</span>${h.district} (高德: ${h.realDistrict})</div>
      <div class="row"><span class="label">地址</span>${h.address}</div>
      <div class="row"><span class="label">风格</span>${h.style}</div>
      <div class="row"><span class="label">餐标</span>${h.budget}</div>
      <div class="row"><span class="label">桌数</span>${h.capacity}</div>
    </div>
  `);
  markers.push({marker: m, data: h});
  m.addTo(map);
});

function applyFilters() {
  let visible = 0;
  markers.forEach(({marker, data}) => {
    let show = true;
    if (filters.district.size && !filters.district.has(data.district)) show = false;
    if (filters.budget.size && !filters.budget.has(data.budget)) show = false;
    if (filters.capacity.size && !filters.capacity.has(data.capacity)) show = false;
    if (filters.style.size) {
      // 风格 matches if ANY selected style appears in the hotel's style tags
      const hasMatch = [...filters.style].some(s => data.style.includes(s));
      if (!hasMatch) show = false;
    }
    if (show) {
      if (!map.hasLayer(marker)) marker.addTo(map);
      visible++;
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  document.getElementById('count').textContent = visible;
}

applyFilters();
</script>
